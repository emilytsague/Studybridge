<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmeldung — StudyBridge</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head><body><main style="max-width:550px;margin:6vh auto;padding:25px"><a class="brand" href="/">StudyBridge.</a><section class="panel" style="margin-top:30px"><span class="eyebrow">PERSÖNLICHER BEREICH</span><h1 id="auth-title">Anmeldung</h1><form id="auth-form"><label class="form-label" for="username">Benutzername</label><input class="search wide" id="username" autocomplete="username" required pattern="[A-Za-z0-9_.-]{3,40}" minlength="3" maxlength="40" placeholder="ariel"><label class="form-label" for="password">Kennwort</label><input class="search wide" id="password" type="password" autocomplete="current-password" required maxlength="200"><div id="register-extra" hidden><p class="muted">Mindestens zwölf Zeichen.<br>Im Benutzernamen sind A–Z, a–z, Ziffern, Punkt, Bindestrich und Unterstrich erlaubt.</p><label class="form-label" for="confirm-password">Kennwort bestätigen</label><input class="search wide" id="confirm-password" type="password" autocomplete="new-password"><label class="form-label" for="invitation">Einladungscode, falls erforderlich</label><input class="search wide" id="invitation" autocomplete="off"></div><button class="btn primary" id="auth-submit" style="margin-top:22px">Anmelden →</button><p class="subtitle" id="auth-message" role="status" style="margin-top:15px"></p></form><button class="text-link" id="toggle-auth" style="margin-top:20px">Konto erstellen</button><p class="muted">Kennwort vergessen? Beende den Server und öffne RECUPERER-COMPTE.cmd auf diesem Computer.</p></section><a href="/" class="text-link">← Zurück zur Anwendung</a></main></body></html>
